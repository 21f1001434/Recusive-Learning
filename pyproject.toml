[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hip-portal-id-agent"
version = "2.4.3"
description = "HIP Portal browser-intelligence agent with governed certified execution, SSO browser automation, network capture, capability learning, and reports"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.45.0",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "typer>=0.12.3",
  "rich>=13.7.0",
  "requests>=2.31.0",
  "Jinja2>=3.1.4",
  "beautifulsoup4>=4.12.3",
  "python-dotenv>=1.0.1",
  "autogen-agentchat==0.7.5",
  "autogen-core==0.7.5",
  "autogen-ext[openai]==0.7.5",
  "certifi>=2024.7.4",
  "browser-use==0.13.8",
  "langchain-community==0.4.2",
  "psutil>=5.9.0,<8",
  "websockets==13.1",
  "packaging>=23.2,<26",
  "mlflow-skinny==3.16.1",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pyautogui==0.9.54; platform_system == 'Windows'",
  "pyautogui-mcp==2026.1.101837; platform_system == 'Windows'",
]

[project.scripts]
hip-agent = "hip_id_agent.cli:app"
hip-portal = "backend.__main__:main"

[project.optional-dependencies]
ui = ["fastapi>=0.115.0", "uvicorn>=0.30.0"]
legacy-streamlit = ["streamlit>=1.40.0"]
test = ["pytest>=8.2.0", "pytest-asyncio>=0.23.7"]

[tool.setuptools]
packages = ["hip_id_agent", "backend", "frontend"]
py-modules = ["streamlit_app"]
include-package-data = true

[tool.setuptools.package-data]
backend = ["webui/*.html", "webui/*.js", "webui/*.css"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
